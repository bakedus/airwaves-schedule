<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iceland Airwaves Schedule</title>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #202124;
      background: #fff;
    }

    body {
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    h1 { font-size: 1.6rem; margin: 0; }

    #controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: .6rem;
    }

    button, select {
      font: inherit;
      padding: .5rem .75rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
      cursor: pointer;
    }

    button.primary {
      background: #1769aa;
      color: white;
      border-color: #1769aa;
    }

    button:disabled { opacity: .5; cursor: not-allowed; }

    #status {
      margin: 1rem 0;
      color: #666;
      font-size: .9rem;
    }

    #tableWrap {
      overflow-x: auto;
      margin-top: 1rem;
    }

    table {
      width: 100%;
      min-width: 700px;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }

    th, td {
      border-right: 1px solid #e5e7eb;
      border-bottom: 1px solid #e5e7eb;
      padding: .65rem;
      text-align: left;
      vertical-align: top;
    }

    th:first-child, td:first-child {
      width: 85px;
      background: #f5f5f5;
      font-weight: 600;
    }

    thead th {
      background: #f0f2f5;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tbody tr:nth-child(even) td:not(:first-child) {
      background: #fafafa;
    }

    .artist {
      display: block;
      margin-bottom: .2rem;
      overflow-wrap: anywhere;
    }

    .fav {
      background: #fff0f0 !important;
    }

    .fav .artist {
      color: #b42332;
      font-weight: 750;
    }

    .star {
      color: #d11b32;
      margin-right: .2rem;
    }

    .empty {
      color: #999;
    }

    .muted { color: #666; }

    @media (max-width: 640px) {
      body { margin-top: 1rem; padding: 0 .5rem; }
      h1 { font-size: 1.3rem; }
      th, td { padding: .45rem; }
    }
  </style>
</head>

<body>
  <header>
    <h1>Iceland Airwaves Schedule</h1>

    <div id="controls">
      <label for="daySelect">Day:</label>
      <select id="daySelect" disabled>
        <option>Loading...</option>
      </select>

      <button id="toggleBtn" class="primary" disabled>
        Show favourites only
      </button>

      <button id="refreshBtn">Reload</button>
    </div>
  </header>

  <div id="status" role="status" aria-live="polite">
    Loading schedule...
  </div>

  <div id="tableWrap"></div>

  <noscript>This schedule requires JavaScript.</noscript>

  <script>
    const CSV_PATH = "schedule.csv";

    // Accepted CSV column names.
    const ALIASES = {
      day: ["day", "weekday", "festival_day"],
      time: ["time", "start_time", "start"],
      venue: ["venue", "stage", "location"],
      artist: ["artist", "act", "performer", "name"],
      highlight: [
        "highlight", "favourite", "favorite", "fav",
        "is_favourite", "is_favorite", "highlighted"
      ]
    };

    const status = document.getElementById("status");
    const tableWrap = document.getElementById("tableWrap");
    const daySelect = document.getElementById("daySelect");
    const toggleBtn = document.getElementById("toggleBtn");
    const refreshBtn = document.getElementById("refreshBtn");

    let performances = [];
    let showFavouritesOnly = false;
    let hasHighlightColumn = false;

    const DAY_ORDER = [
      "Monday", "Tuesday", "Wednesday", "Thursday",
      "Friday", "Saturday", "Sunday"
    ];

    function normalize(value) {
      return String(value ?? "").trim().toLowerCase();
    }

    function normalizeDay(value) {
      const v = normalize(value);

      const days = {
        mon: "Monday", monday: "Monday",
        tue: "Tuesday", tues: "Tuesday", tuesday: "Tuesday",
        wed: "Wednesday", wednesday: "Wednesday",
        thu: "Thursday", thur: "Thursday",
        thurs: "Thursday", thursday: "Thursday",
        fri: "Friday", friday: "Friday",
        sat: "Saturday", saturday: "Saturday",
        sun: "Sunday", sunday: "Sunday"
      };

      return days[v] || String(value ?? "").trim();
    }

    function isTime(value) {
      return /^\d{1,2}:\d{2}$/.test(String(value ?? "").trim());
    }

    function findHeader(headers, aliases) {
      return headers.find(h =>
        aliases.includes(normalize(h)) &&
        normalize(h) !== ""
      );
    }

    function isTruthy(value) {
      return [
        "1", "yes", "y", "true", "x", "★", "fav",
        "f", "highlight", "hl"
      ].includes(normalize(value));
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[ch]);
    }

    function parseRows(data, meta) {
      const headers = meta.fields || Object.keys(data[0] || {});

      let mapping = {};
      for (const field of Object.keys(ALIASES)) {
        mapping[field] = findHeader(headers, ALIASES[field]);
      }

      // Detect the shifted layout in which:
      // time contains the day, venue contains the time,
      // artist contains the venue, and highlight contains
      // the artist. The actual highlight flag is in the
      // otherwise unnamed final column.
      const sample = data.find(r =>
        Object.values(r).some(v => String(v ?? "").trim() !== "")
      );

      if (sample &&
          mapping.day && mapping.time && mapping.venue &&
          mapping.artist && mapping.highlight &&
          !normalizeDay(sample[mapping.time]).match(/^\d{1,2}:\d{2}$/) &&
          isTime(sample[mapping.venue]) &&
          DAY_ORDER.includes(normalizeDay(sample[mapping.time]))) {

        const originalHeaders = headers;
        const originalHighlightIndex =
          originalHeaders.indexOf(mapping.highlight);

        const extraHeader = originalHeaders.find(h =>
          normalize(h) === "" ||
          normalize(h).startsWith("__parsed_extra")
        );

        mapping = {
          day: mapping.time,
          time: mapping.venue,
          venue: mapping.artist,
          artist: mapping.highlight,
          highlight: extraHeader ||
            (originalHighlightIndex >= 0
              ? "__parsed_extra"
              : null)
        };
      }

      if (!mapping.day || !mapping.time ||
          !mapping.venue || !mapping.artist) {
        throw new Error(
          "Required columns not found. Expected day, time, venue and artist."
        );
      }

      hasHighlightColumn = Boolean(mapping.highlight);

      // A trailing unnamed CSV field can be represented by
      // Papa Parse as __parsed_extra rather than a normal key.
      performances = data.map(row => {
        const extra = row.__parsed_extra;
        let highlight = mapping.highlight
          ? row[mapping.highlight]
          : "";

        if (mapping.highlight === "__parsed_extra" ||
            (Array.isArray(extra) && !highlight)) {
          highlight = Array.isArray(extra) ? extra[0] : highlight;
        }

        return {
          day: normalizeDay(row[mapping.day]),
          time: String(row[mapping.time] ?? "").trim(),
          venue: String(row[mapping.venue] ?? "").trim(),
          artist: String(row[mapping.artist] ?? "").trim(),
          highlight: String(highlight ?? "").trim()
        };
      }).filter(p => p.day && p.time && p.venue && p.artist);
    }

    function loadCsv() {
      refreshBtn.disabled = true;
      status.textContent = "Loading schedule...";
      tableWrap.innerHTML = "";

      Papa.parse(CSV_PATH, {
        download: true,
        header: true,
        skipEmptyLines: "greedy",
        transformHeader: h => h.trim(),
        complete(result) {
          try {
            if (!result.data.length) {
              throw new Error("The CSV file contains no data.");
            }

            parseRows(result.data, result.meta);

            if (!performances.length) {
              throw new Error("No valid performances were found.");
            }

            if (result.errors.length) {
              console.warn("CSV parsing warnings:", result.errors);
            }

            populateDays();

            toggleBtn.disabled = !hasHighlightColumn;
            toggleBtn.textContent = showFavouritesOnly
              ? "Show all artists"
              : "Show favourites only";

            status.textContent =
              `Loaded ${performances.length} performances.`;

            render();
          } catch (error) {
            performances = [];
            status.textContent = `Error: ${error.message}`;
            tableWrap.innerHTML = "";
            console.error(error);
          } finally {
            refreshBtn.disabled = false;
          }
        },
        error(error) {
          status.textContent = `Failed to load CSV: ${error.message || error}`;
          refreshBtn.disabled = false;
        }
      });
    }

    function populateDays() {
      const previousDay = daySelect.value;

      const days = [...new Set(performances.map(p => p.day))];
      days.sort((a, b) => {
        const ai = DAY_ORDER.indexOf(a);
        const bi = DAY_ORDER.indexOf(b);
        if (ai !== -1 && bi !== -1) return ai - bi;
        if (ai !== -1) return -1;
        if (bi !== -1) return 1;
        return a.localeCompare(b);
      });

      daySelect.innerHTML = days.map(day =>
        `<option value="${escapeHtml(day)}">${escapeHtml(day)}</option>`
      ).join("");

      daySelect.disabled = days.length === 0;

      if (days.includes(previousDay)) {
        daySelect.value = previousDay;
      }

      daySelect.onchange = render;
    }

    function render() {
      const selectedDay = daySelect.value;

      let list = performances.filter(p => p.day === selectedDay);

      if (showFavouritesOnly && hasHighlightColumn) {
        list = list.filter(p => isTruthy(p.highlight));
      }

      toggleBtn.textContent = showFavouritesOnly
        ? "Show all artists"
        : "Show favourites only";

      if (!list.length) {
        tableWrap.innerHTML =
          '<p class="muted">No performances match this selection.</p>';
        status.textContent = "No performances to display.";
        return;
      }

      const venues = [...new Set(list.map(p => p.venue))]
        .sort((a, b) => a.localeCompare(b));

      const times = [...new Set(list.map(p => p.time))]
        .sort((a, b) => {
          function scheduleMinutes(time) {
            const [hours, minutes] = time.split(":").map(Number);
            let total = hours * 60 + minutes;
      
            // Treat midnight through 03:00 as the end of the day.
            if (hours <= 3) {
              total += 24 * 60;
            }
      
            return total;
          }
      
          return scheduleMinutes(a) - scheduleMinutes(b);
        });


      const bySlot = new Map();

      for (const p of list) {
        const key = `${p.time}\u0000${p.venue}`;
        if (!bySlot.has(key)) bySlot.set(key, []);
        bySlot.get(key).push(p);
      }

      let html = "<table><thead><tr>";
      html += '<th scope="col">Time</th>';

      for (const venue of venues) {
        html += `<th scope="col">${escapeHtml(venue)}</th>`;
      }

      html += "</tr></thead><tbody>";

      for (const time of times) {
        html += `<tr><th scope="row">${escapeHtml(time)}</th>`;

        for (const venue of venues) {
          const key = `${time}\u0000${venue}`;
          const acts = bySlot.get(key) || [];

          if (!acts.length) {
            html += '<td><span class="empty">—</span></td>';
            continue;
          }

          html += "<td>";

          for (const p of acts) {
            const favourite = hasHighlightColumn &&
              isTruthy(p.highlight);

            html += `<div class="${favourite ? "fav" : ""}">`;

            if (favourite) {
              html += '<span class="star" aria-label="Favourite">★</span>';
            }

            html += `<span class="artist">${escapeHtml(p.artist)}</span>`;
            html += "</div>";
          }

          html += "</td>";
        }

        html += "</tr>";
      }

      html += "</tbody></table>";
      tableWrap.innerHTML = html;

      status.textContent =
        `${selectedDay}: ${list.length} performances across ${venues.length} venues` +
        (showFavouritesOnly ? " (favourites only)." : ".");
    }

    toggleBtn.addEventListener("click", () => {
      if (!hasHighlightColumn) return;
      showFavouritesOnly = !showFavouritesOnly;
      render();
    });

    refreshBtn.addEventListener("click", loadCsv);

    loadCsv();
  </script>
</body>
</html>
