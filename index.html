<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Airwaves schedule</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color:#111; }
    header { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1rem; }
    h1 { margin:0; font-size:1.25rem; }
    #controls { display:flex; gap:.5rem; align-items:center; }
    button { padding:.4rem .7rem; border-radius:6px; border:1px solid #ccc; background:#f8f8f8; cursor:pointer; }
    button.primary { background:#0366d6; color:#fff; border-color:transparent; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    table { width:100%; border-collapse:collapse; margin-top:1rem; }
    th, td { text-align:left; padding:.5rem .6rem; border-bottom:1px solid #eee; }
    th { background:#fafafa; font-weight:600; font-size:.95rem; }
    .fav { color:#e11; font-weight:700; }
    .muted { color:#666; font-size:.95rem; }
    #status { margin-top:.5rem; color:#666; font-size:.95rem; }
    @media (max-width:640px){ th:nth-child(1), td:nth-child(1){display:none;} }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js" integrity="REPLACE_WITH_SRI_HASH" crossorigin="anonymous"></script>
</head>
<body>
  <header>
    <h1>Airwaves schedule</h1>
    <div id="controls">
      <button id="toggleBtn" class="primary" disabled>Show favourites only</button>
      <button id="refreshBtn" title="Reload CSV">Reload</button>
    </div>
  </header>

  <div id="status" class="muted">Loading schedule…</div>
  <noscript><div class="muted">This page requires JavaScript to load the schedule. Please enable JavaScript or view schedule.csv directly.</div></noscript>
  <div id="tableWrap"></div>

  <script>
    // Adjust this if your CSV file has a different name or path
    const CSV_PATH = 'schedule.csv';

    // Config: names of CSV columns we look for (case-insensitive)
    const PREFERRED = {
      date: ['date', 'day_date', 'day'],
      weekday: ['weekday', 'day_of_week', 'day'],
      favourite: ['favourite', 'favorite', 'fav', 'favs', 'is_favourite', 'highlight', 'highlights']
    };

    let rows = [];
    let showFavouritesOnly = true; // initial behaviour
    const status = document.getElementById('status');
    const toggleBtn = document.getElementById('toggleBtn');
    const refreshBtn = document.getElementById('refreshBtn');

    toggleBtn.addEventListener('click', () => {
      if (toggleBtn.disabled) return;
      showFavouritesOnly = !showFavouritesOnly;
      // text will be set in render() depending on fav column presence
      render();
    });
    refreshBtn.addEventListener('click', loadCsv);

    function normalizeHeaders(headers) {
      return headers.map(h => (h || '').toString().trim().toLowerCase());
    }

    function findColumnKey(headersNormalized, candidates) {
      for (const c of candidates) {
        const idx = headersNormalized.indexOf(c.toLowerCase());
        if (idx !== -1) return { name: headersNormalized[idx], idx };
      }
      return null;
    }

    function truthyFav(value) {
      if (value === undefined || value === null) return false;
      const s = String(value).trim().toLowerCase();
      return s === '1' || s === 'yes' || s === 'y' || s === 'true' || s === 'x' || s === '★' || s === 'fav' || s === 'f' || s === 'highlight' || s === 'hl' ;
    }

    function getTodayStrings() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const iso = `${yyyy}-${mm}-${dd}`;
      const weekdayLong = now.toLocaleString(undefined, { weekday: 'long' }); // e.g., "Monday"
      const weekdayShort = now.toLocaleString(undefined, { weekday: 'short' }); // e.g., "Mon"
      return { iso, weekdayLong: weekdayLong.toLowerCase(), weekdayShort: weekdayShort.toLowerCase() };
    }

    function loadCsv() {
      status.textContent = 'Loading schedule…';
      Papa.parse(CSV_PATH, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(result) {
          if (result.errors && result.errors.length) {
            status.textContent = 'Error parsing CSV: ' + result.errors[0].message;
            console.error(result.errors);
            return;
          }
          rows = result.data;
          status.textContent = `Loaded ${rows.length} rows`;
          render();
        },
        error: function(err) {
          status.textContent = 'Failed to load CSV: ' + err;
          console.error(err);
        }
      });
    }

    function render() {
      const wrap = document.getElementById('tableWrap');
      if (!rows || rows.length === 0) {
        wrap.innerHTML = '<div class="muted">No schedule data available.</div>';
        return;
      }
      // Determine column names (normalized)
      const headers = Object.keys(rows[0]);
      const headersNorm = normalizeHeaders(headers);

      const dateCol = findColumnKey(headersNorm, PREFERRED.date);
      const weekdayCol = findColumnKey(headersNorm, PREFERRED.weekday);
      const favCol = findColumnKey(headersNorm, PREFERRED.favourite);

      // Enable/disable favourites toggle based on presence of column
      if (!favCol) {
        toggleBtn.disabled = true;
        toggleBtn.title = 'No favourites column present in CSV';
        // If user had favourites-only mode on, turn it off to avoid empty results
        if (showFavouritesOnly) showFavouritesOnly = false;
      } else {
        toggleBtn.disabled = false;
        toggleBtn.title = 'Toggle favourites filter';
      }

      // Update toggle text to reflect current state & availability
      if (!favCol) {
        toggleBtn.textContent = 'No favourites column';
      } else {
        toggleBtn.textContent = showFavouritesOnly ? 'Show all shows for the day' : 'Show favourites only';
      }

      const today = getTodayStrings();

      // Filter for "today" if we have a date or weekday column; otherwise show everything
      let dayFiltered = rows.filter(r => {
        if (dateCol && r[headers[dateCol.idx]]) {
          const val = String(r[headers[dateCol.idx]]).trim();
          if (val === '') return false;
          if (val === today.iso) return true;
          const parsed = Date.parse(val);
          if (!isNaN(parsed)) {
            const d = new Date(parsed);
            const p = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            return p === today.iso;
          }
          if (val.toLowerCase().includes(today.weekdayLong) || val.toLowerCase().includes(today.weekdayShort)) return true;
          return false;
        }
        if (weekdayCol && r[headers[weekdayCol.idx]]) {
          const v = String(r[headers[weekdayCol.idx]]).toLowerCase();
          return v.includes(today.weekdayLong) || v.includes(today.weekdayShort);
        }
        // no date info: include
        return true;
      });

      // Apply favourites filter if requested
      let finalRows = dayFiltered;
      if (showFavouritesOnly && favCol) {
        finalRows = dayFiltered.filter(r => truthyFav(r[headers[favCol.idx]]));
      }

      // Build table
      if (finalRows.length === 0) {
        wrap.innerHTML = `<div class="muted">No shows match this filter.</div>`;
        return;
      }

      // Choose visible columns: show original headers (you can further restrict if desired)
      const colsToShow = headers.slice(0, headers.length).filter(h => h && h.trim() !== '');

      // Render HTML table
      let html = '<table><thead><tr>';
      for (const c of colsToShow) {
        html += `<th>${escapeHtml(c)}</th>`;
      }
      html += '</tr></thead><tbody>';
      for (const r of finalRows) {
        html += '<tr>';
        for (const c of colsToShow) {
          let val = r[c];
          if (val === undefined || val === null) val = '';
          // mark favourites
          if (favCol && c.toLowerCase() === headers[headers[favCol.idx]].toLowerCase()) {
            if (truthyFav(val)) val = '<span class="fav">★</span>';
            else val = '';
          } else {
            val = escapeHtml(String(val));
          }
          html += `<td>${val}</td>`;
        }
        html += '</tr>';
      }
      html += '</tbody></table>';
      wrap.innerHTML = html;
      status.textContent = `${finalRows.length} shows shown (${rows.length} total rows loaded).`;
    }

    function escapeHtml(s) {
      return s
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    // initial button state (disabled until we know if a favourites column exists)
    toggleBtn.disabled = true;
    toggleBtn.textContent = showFavouritesOnly ? 'Show all shows for the day' : 'Show favourites only';

    // Kick off
    loadCsv();
  </script>
</body>
</html>
