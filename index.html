<head>
<meta charset="utf-8">

<title>Airwaves 2026 Schedule</title>
<style>
:root{--bg:#0f1724;--bg2:#182233;--line:#2a3750;--tx:#eef2f7;--mu:#97a6bd;--gold:#f5b942;--ppm:3px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Avenir Next","Segoe UI",system-ui,sans-serif}
header{padding:18px 14px 6px;max-width:1100px;margin:0 auto}
h1{margin:0;font-size:24px;letter-spacing:-.01em}
.sub{margin:4px 0 0;color:var(--mu);font-size:13px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px;max-width:1100px;margin:0 auto}
select,button.tog{font:inherit;font-size:16px;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
button.tog{cursor:pointer;font-weight:600}
button.tog[aria-pressed=true]{background:var(--gold);color:#241a05;border-color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:0 14px 40px}
.msg{padding:24px 4px;color:var(--mu)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg2);-webkit-overflow-scrolling:touch}
.tl{width:max-content;min-width:100%}
.tl-head,.tl-row{display:flex}
.tl-row{border-top:1px solid var(--line)}
.corner,.vl{position:sticky;left:0;z-index:3;width:88px;flex:none;background:var(--bg2)}
.corner{padding:6px 8px;color:var(--mu);font-size:12px;height:28px}
.ticks{position:relative;height:28px;flex:none}
.ticks span{position:absolute;top:6px;font-size:12px;color:var(--mu);transform:translateX(-50%)}
.vl{border-left:4px solid var(--c);padding:8px;font-weight:700;font-size:13px;display:flex;align-items:center;box-shadow:2px 0 6px #0006}
.track{position:relative;height:92px;flex:none;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(var(--ppm)*30) 100%}
.blk{position:absolute;top:8px;bottom:8px;border:1px solid var(--c);border-radius:8px;padding:6px 6px 6px 8px;overflow:hidden;background:color-mix(in srgb,var(--c) 30%,var(--bg2));font-size:12.5px;line-height:1.25}
.blk.fav,.item.fav{box-shadow:0 0 0 2px var(--gold)}
.blk b{display:block;padding-right:22px;overflow-wrap:anywhere}
.blk small{position:absolute;left:8px;bottom:5px;color:var(--mu);font-size:11px}
.star{background:none;border:0;color:var(--mu);font-size:20px;line-height:1;cursor:pointer;padding:0;width:32px;height:32px}
.star[aria-pressed=true]{color:var(--gold)}
.blk .star{position:absolute;top:0;right:0}
.hour{margin:18px 0 6px;color:var(--mu);font-size:13px;font-weight:600}
.item{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:8px 6px 8px 12px;margin-bottom:8px}
.item .t{width:96px;flex:none;font-variant-numeric:tabular-nums;color:var(--mu);font-size:13px}
.item .n{flex:1;min-width:0}
.item .n b{display:block;font-size:16px;overflow-wrap:anywhere}
.item .n span{color:var(--mu);font-size:13px}
.info{margin:0 0 10px;color:var(--mu);font-size:13px}
a{color:inherit}
footer{max-width:1100px;margin:0 auto;padding:0 14px 30px;color:var(--mu);font-size:12px}
footer button{font:inherit;color:var(--mu);background:none;border:0;text-decoration:underline;padding:0;cursor:pointer}
@media(min-width:720px){.controls{display:flex}.controls>*{flex:1}}
</style>
</head>
<body>
<header>
<h1>Airwaves 2026 Schedule</h1>
</header>
<div class="controls">
<select id="day" aria-label="Day"></select>
<select id="venue" aria-label="Venue"></select>
<select id="view" aria-label="View"><option value="list">Timeline</option><option value="grid">Grid</option></select>
<button id="fav" class="tog" aria-pressed="false">Show All</button>
</div>
<main aria-live="polite"><p id="info" class="info"></p><div id="out"></div></main>
<footer><button id="reset">Clear stars I tapped on this device</button></footer>

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

try { over = JSON.parse(localStorage.getItem(LS) || "{}") || {}; } catch (e) {}

const addDays = (d,n) => { const x = new Date(d + "T00:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0,10); };
const shortDay = d => ({4:"Thurs",5:"Fri",6:"Sat"})[new Date(d + "T00:00:00Z").getUTCDay()] || dayLabel(d);
const dayLabel = d => new Date(d + "T00:00:00Z").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",timeZone:"UTC"});

const isFav = e => e.id in over ? over[e.id] : e.csvFav;

function setData(rows){
  events = rows.filter(r => r.date && r.start && r.artist).map(r => {
    const [h,m] = r.start.split(":").map(Number), [eh,em] = (r.end || r.start).split(":").map(Number);
    const late = h < CUTOFF_HOUR, s = h*60 + m + (late ? 1440 : 0);
    return { id: [r.date,r.start,r.venue].join("|"), day: late ? addDays(r.date,-1) : r.date, s, e: s + ((eh*60+em - h*60 - m + 1440) % 1440),
      start: r.start, end: r.end, venue: r.venue, artist: r.artist, link: r.link, csvFav: r.favourite === true || /^(y|yes|true|1)$/i.test(String(r.favourite)) };
  });
  venues = [...new Set(events.map(e => e.venue))].sort((a,b) => (VENUES.indexOf(a)+1 || 99) - (VENUES.indexOf(b)+1 || 99));
  days = [...new Set(events.map(e => e.day))].sort();
  $("day").innerHTML = days.map(d => `<option value="${d}">${shortDay(d)}</option>`).join("");
  $("venue").innerHTML = '<option value="all">All venues</option>' + venues.map(v => `<option>${esc(v)}</option>`).join("");
  const today = new Date(Date.now() - CUTOFF_HOUR*3600e3).toISOString().slice(0,10);
  $("day").value = days.includes(today) ? today : days[0];
  render();
}

const col = v => COLORS[Math.max(0, venues.indexOf(v)) % COLORS.length];
const star = e => `<button class="star" data-id="${esc(e.id)}" aria-pressed="${isFav(e)}" aria-label="Favourite ${esc(e.artist)}">${isFav(e) ? "★" : "☆"}</button>`;
const name = e => e.link ? `<a href="${esc(e.link)}" target="_blank" rel="noopener">${esc(e.artist)}</a>` : esc(e.artist);

function render(){
  const day = $("day").value, ven = $("venue").value, favOnly = $("fav").getAttribute("aria-pressed") === "true";
  const dayEv = events.filter(e => e.day === day);
  const list = dayEv.filter(e => (ven === "all" || e.venue === ven) && (!favOnly || isFav(e))).sort((a,b) => a.s - b.s || a.venue.localeCompare(b.venue));
  const nv = new Set(list.map(e => e.venue)).size;
  $("info").textContent = `${list.length} show${list.length === 1 ? "" : "s"} across ${nv} venue${nv === 1 ? "" : "s"}`;
  const out = $("out");
  if (!list.length){ out.innerHTML = `<p class="msg">${favOnly ? "No favourites here yet. Tap ☆ on a show, or set favourite to true in the data." : "No shows match these filters."}</p>`; return; }
  if ($("view").value === "list"){
    let h = "", last = -1;
    for (const e of list){
      const hr = Math.floor(e.s/60);
      if (hr !== last){ h += `<div class="hour">${fmt(hr*60)}</div>`; last = hr; }
      h += `<div class="item${isFav(e) ? " fav" : ""}" style="--c:${col(e.venue)}"><div class="t">${e.start} – ${e.end}</div><div class="n"><b>${name(e)}</b><span>${esc(e.venue)}</span></div>${star(e)}</div>`;
    }
    out.innerHTML = h; return;
  }
  const t0 = Math.floor(Math.min(...dayEv.map(e => e.s))/30)*30, t1 = Math.ceil(Math.max(...dayEv.map(e => e.e))/30)*30, w = (t1 - t0)*PPM;
  let ticks = ""; for (let m = t0; m <= t1; m += 30) ticks += `<span style="left:${(m-t0)*PPM}px">${fmt(m)}</span>`;
  let h = `<div class="scroll"><div class="tl"><div class="tl-head"><div class="corner">GMT</div><div class="ticks" style="width:${w}px">${ticks}</div></div>`;
  for (const v of venues.filter(v => ven === "all" || v === ven)){
    const ve = list.filter(e => e.venue === v); if (!ve.length) continue;
    h += `<div class="tl-row" style="--c:${col(v)}"><div class="vl">${esc(v)}</div><div class="track" style="width:${w}px">` +
      ve.map(e => `<div class="blk${isFav(e) ? " fav" : ""}" style="left:${(e.s-t0)*PPM}px;width:${(e.e-e.s)*PPM-3}px"><b>${name(e)}</b><small>${e.start}–${e.end}</small>${star(e)}</div>`).join("") + `</div></div>`;
  }
  out.innerHTML = h + "</div></div>";
}

$("out").addEventListener("click", ev => {
  const b = ev.target.closest(".star"); if (!b) return;
  const e = events.find(x => x.id === b.dataset.id); over[e.id] = !isFav(e);
  try { localStorage.setItem(LS, JSON.stringify(over)); } catch (x) {}
  const sy = scrollY, sx = document.querySelector(".scroll")?.scrollLeft || 0; render();
  const s = document.querySelector(".scroll"); if (s) s.scrollLeft = sx; scrollTo(0, sy);
});
["day","venue","view"].forEach(id => $(id).addEventListener("change", render));
$("fav").addEventListener("click", () => {
  const on = $("fav").getAttribute("aria-pressed") !== "true";
  $("fav").setAttribute("aria-pressed", on); $("fav").textContent = on ? "Show Favourites" : "Show All"; render();
});
$("reset").addEventListener("click", () => { over = {}; try { localStorage.removeItem(LS); } catch (x) {} render(); });

setData(JSON.parse($("data").textContent));
</script>
</body>
</html>
